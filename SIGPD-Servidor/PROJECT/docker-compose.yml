services:
  draftotux_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draftotux_app
    ports:
      - "80:80"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: draftotux_bd
    environment:
      MYSQL_ROOT_PASSWORD: Manzana@13
      MYSQL_DATABASE: draftotux
    ports:
      - "3306:3306"
    volumes:
      - db-volume:/var/lib/mysql
      - ./other/bd.sql:/docker-entrypoint-initdb.d/bd.sql

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - database
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: Manzana@13
      MYSQL_ROOT_PASSWORD: Manzana@13

volumes:
  db-volume: